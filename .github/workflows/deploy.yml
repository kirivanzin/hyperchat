# Deploying on a merge, and by dispatch when a failed apply needs recovery.
#
# Both entry points use the same `dev` environment and identity. The environment holds the deployed
# allowlist as a secret, which GitHub masks in step headers as well as log lines. `PROJECT` and
# `WIF_PROVIDER` are repository variables: identifiers, not credentials; gcloud prints them anyway,
# and the pull-request job needs them to attempt the authentication it must be refused.
#
# `dev` has no protection rules, so `main` goes live on merge and the `ci` check is the only gate.
# That is a decision, not an omission: the one environment is not a staging one — it is public, holds
# the provider key, and the allowlist is the only thing bounding who can spend — so a second approval
# from the person who just merged would be a habit rather than a second pair of eyes. `#78` is where
# the gate returns, with an environment it can actually protect.
#
# A merge only queues a deploy when it can change what runs: `scripts/deployable.sh` decides, and the
# `changed` job below is where it is asked. A merge that touches documentation, tests or the Makefile
# still runs this workflow and still reports — the `deploy` job is skipped and no build is pushed.
# **Skipped is not failed**: a skipped job is neutral, the run is green, and a skipped deploy read as
# a red one would be worse than the queue it replaces.
#
# `workflow_dispatch` bypasses the filter on purpose. The recovery path exists to redeploy a commit
# after a failed apply, and that commit may well be one whose merge changed nothing deployable.
#
# The identity is `terraform/registry/identity.tf` (#51), applied once in the one-time root. This
# workflow is its only consumer and can never widen it: the provider refuses any repository, ref,
# workflow file or event other than the ones below.
name: deploy

on:
  # After the CI workflow succeeds on main: a merge must not deploy a commit the tests have not seen.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # The recovery path. A failed apply must not require an empty commit to retry.
  workflow_dispatch:
  # The failing direction: the negative job below runs on pull requests, while the deploy job is
  # skipped by its own condition.
  pull_request:

# Nothing here writes the repository. The OIDC token is the only extra capability, and only the job
# that needs it asks for it.
permissions:
  contents: read


jobs:
  changed:
    # `workflow_run` cannot take a `paths` filter, so the question is asked as a job whose answer the
    # deploy job waits for. The decision is a script rather than inline shell so it can be run from a
    # terminal against real commits, which is the only way to test it without merging something.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: the head, and the commit `main` pointed at before it. `HEAD^1` is that
          # parent for a merge commit and for a squashed one, which is why the base is not read from
          # the event payload — squash merges do not have two parents to read it from.
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: can this commit change what runs?
        id: filter
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # The recovery path, stated here rather than left to an empty diff: a dispatch deploys
            # the commit it names even when that commit changed nothing deployable.
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: the filter is bypassed on purpose"
            exit 0
          fi
          base="$(git rev-parse HEAD^1)"
          verdict="$(scripts/deployable.sh "$base" HEAD)"
          echo "deployable=${verdict}" >> "$GITHUB_OUTPUT"
          echo "deployable=${verdict}, ${base}..HEAD"

  deploy:
    needs: changed
    # Skipped, not failed: a merge that cannot change what runs leaves this job neutral and the run
    # green. `workflow_dispatch` is unconditional, and the pull-request path never deploys — it is
    # here only for the negative job below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       needs.changed.outputs.deployable == 'true')
    # Two deploys must not race: they would contend on the Terraform state lock, and cancelling an
    # apply half way is how the lock had to be cleared by hand. This is on the job, not on the
    # workflow, because the negative job below runs on every pull request — a workflow-level group
    # would queue pull-request checks behind deploys and never cancel them.
    concurrency:
      group: deploy-hyperchat
      cancel-in-progress: false
    # The environment the allowlist lives on, and the name the deployment is recorded under. It has
    # no protection rules: the merge is the approval while there is only one environment, and #78 is
    # where a reviewer comes back with an environment to protect.
    environment: dev
    # The image build is the slow step; twenty minutes bounds a stalled registry pull rather than
    # letting the default six hours hold a runner.
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.PROJECT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      # The deployed allowlist. The environment secret is masked by GitHub in headers and logs; it is
      # not the `.env` value, which includes the contributor.
      ALLOWED_SUBS: ${{ secrets.ALLOWED_SUBS }}
      TF_VAR_allowed_subs: ${{ secrets.ALLOWED_SUBS }}
      # There is nobody here to answer `terraform apply`'s approval prompt, and a runner's stdin does
      # not close: a dispatch sat on that prompt holding the state lock until it was cancelled. There
      # is no environment reviewer on `dev` either, so the approval is the merge, the dispatch, or
      # the `ci` check that has to be green before either reaches this job.
      AUTO_APPROVE: -auto-approve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the successful CI run tested; a manual dispatch has no workflow_run, so it
          # checks out the dispatched ref's commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: require configuration
        # Before anything authenticates: an empty value is a wrong environment/variable setup, not a
        # failed deploy.
        run: |
          set -eu
          : "${PROJECT:?repository variable PROJECT is unset}"
          : "${WIF_PROVIDER:?repository variable WIF_PROVIDER is unset}"
          : "${ALLOWED_SUBS:?environment secret ALLOWED_SUBS is unset}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: hyperchat-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 363.0.0"
          project_id: ${{ env.PROJECT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"

      - name: which image is this commit's?
        # Recorded, not deployed: `make deploy` passes `-var="image=$(REMOTE)"`, and `REMOTE` is
        # `registry/hyperchat:<tag>` — the tag is what the apply deploys. This digest is what the tag
        # pointed at when the run started, and it is here to be compared with what Cloud Run reports
        # afterwards. Deploying by tag is safe above because `docker_config.immutable_tags` in
        # `terraform/registry` refuses to move one, which is the reason worth stating.
        id: digest
        run: |
          set -eu
          if digest="$(make image-digest 2>/dev/null)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "image for this commit is already published: ${digest}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "no image for this commit yet; it will be built and pushed"
          fi

      - name: authenticate Docker
        if: steps.digest.outputs.exists == 'false'
        run: make login

      - name: build the image
        if: steps.digest.outputs.exists == 'false'
        run: make build

      - name: push the image
        if: steps.digest.outputs.exists == 'false'
        run: make push

      - name: deploy
        # The provider key is write-only to Terraform, not absent from the apply. Read the existing
        # Secret Manager version into this process's environment; `make deploy` passes it as
        # TF_VAR_provider_api_key and Terraform stores it neither in state nor in the plan file.
        run: |
          set -eu
          PROVIDER_API_KEY="$(gcloud secrets versions access latest \
            --secret=provider-api-key --project="$PROJECT")"
          export PROVIDER_API_KEY
          make deploy

      - name: the service answers
        # Both of these need no user token, which is exactly why they belong here. `make smoke` needs
        # a token minted by a person and stays a human step.
        run: |
          set -eu
          URL="$(gcloud run services describe hyperchat --region australia-southeast1 \
            --project "$PROJECT" --format='value(status.url)')"
          livez="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/livez")"
          me="$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/me")"
          echo "livez=$livez api/me=$me url=$URL"
          test "$livez" = 200
          test "$me" = 401

      - name: what the apply left, if it failed
        # A half-applied state is the failure this repository has produced twice; the plan says what
        # was left behind, and a log without it turns a page into an investigation.
        if: failure()
        run: |
          PROVIDER_API_KEY="$(gcloud secrets versions access latest \
            --secret=provider-api-key --project="$PROJECT")" || true
          export PROVIDER_API_KEY
          make deploy-plan || true

  ref-not-main-cannot-auth:
    # The provider's condition allows only refs/heads/main, workflow_dispatch/workflow_run and this
    # workflow file. This job proves the pull-request direction is refused, and does not use the
    # `dev` environment or its allowlist.
    #
    # A fork pull request is skipped, and the skip is stated here rather than left to an empty
    # variable: a fork does not receive repository variables, so a condition that only tested `vars`
    # disabled this job silently on the pull request class it exists to police.
    #
    # The variables are no longer in the condition. A same-repo pull request without them now fails at
    # `require identity configuration` instead of skipping, which is the honest answer: a guard that
    # is not configured should be red, not absent.
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.PROJECT }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
    steps:
      - name: require identity configuration
        run: |
          set -eu
          : "${PROJECT:?repository variable PROJECT is unset}"
          : "${WIF_PROVIDER:?repository variable WIF_PROVIDER is unset}"

      - name: attempt authentication from this ref
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: hyperchat-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com

      - name: the non-main ref must be refused
        if: steps.auth.outcome == 'success'
        run: |
          echo "authentication succeeded on ${{ github.ref }}; the Workload Identity condition is not restricting the workflow, ref and event" >&2
          exit 1
